<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Dinner Wheel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: one narrow column of index-card rows. The week is a list of nights, the basil green carries every action, amber marks locked nights. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --sunk:#E8EDE7; --line:#D8DFD6; --ink:#17211B; --muted:#5F6F64;
  --accent:#1D7A4E; --accent-ink:#FFFFFF; --accent-soft:#DCEFE3;
  --lock:#A85F00; --lock-soft:#FBEACB; --danger:#B3362B; --heart:#D0426A;
  --shadow:0 1px 2px rgba(20,35,25,.06),0 6px 18px rgba(20,35,25,.06);
  --c-chicken-bg:#FCE8C6; --c-chicken-fg:#7A4A00;
  --c-beef-bg:#F6D8D2; --c-beef-fg:#8A2E21;
  --c-pork-bg:#F7DAE7; --c-pork-fg:#85294F;
  --c-seafood-bg:#D4E9F3; --c-seafood-fg:#13597A;
  --c-veg-bg:#D9EED2; --c-veg-fg:#2A6A1D;
  --c-other-bg:#E3E1EE; --c-other-fg:#4A4572;
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111713; --surface:#19211B; --sunk:#222B24; --line:#2D3830; --ink:#E9F0EA; --muted:#97A89D;
    --accent:#4CC38A; --accent-ink:#06210F; --accent-soft:#1D3A2A;
    --lock:#F0B35A; --lock-soft:#3A2D12; --danger:#FF8A7D; --heart:#FF7F9F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    --c-chicken-bg:#3A2D12; --c-chicken-fg:#F3C77A;
    --c-beef-bg:#3F1F1A; --c-beef-fg:#F2A99E;
    --c-pork-bg:#3D1D2E; --c-pork-fg:#F0A7C6;
    --c-seafood-bg:#12303E; --c-seafood-fg:#8FD0EC;
    --c-veg-bg:#1F3A1B; --c-veg-fg:#A5DD97;
    --c-other-bg:#2A2842; --c-other-fg:#BDB8EA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#19211B; --sunk:#222B24; --line:#2D3830; --ink:#E9F0EA; --muted:#97A89D;
  --accent:#4CC38A; --accent-ink:#06210F; --accent-soft:#1D3A2A;
  --lock:#F0B35A; --lock-soft:#3A2D12; --danger:#FF8A7D; --heart:#FF7F9F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  --c-chicken-bg:#3A2D12; --c-chicken-fg:#F3C77A;
  --c-beef-bg:#3F1F1A; --c-beef-fg:#F2A99E;
  --c-pork-bg:#3D1D2E; --c-pork-fg:#F0A7C6;
  --c-seafood-bg:#12303E; --c-seafood-fg:#8FD0EC;
  --c-veg-bg:#1F3A1B; --c-veg-fg:#A5DD97;
  --c-other-bg:#2A2842; --c-other-fg:#BDB8EA;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 120px;
}
body.noscroll{overflow:hidden}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}
.ic{display:inline-flex;flex:none}

.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0 18px}
.brand{font:800 21px/1 var(--font-display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px;color:var(--ink)}
.brand .ic{color:var(--accent)}
.today-label{font-size:13px;color:var(--muted);font-weight:500}
.view{display:flex;flex-direction:column;gap:16px}
.view-title{font:800 32px/1.02 var(--font-display)}
.sub{color:var(--muted);font-size:14px}
.hint{color:var(--muted);font-size:13px;text-align:center}
.note{font-size:13.5px;background:var(--lock-soft);color:var(--lock);padding:10px 12px;border-radius:10px}
.note.err{background:transparent;color:var(--danger);padding:0}
.label{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.03em}

.btn{min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.big{min-height:56px;font-size:16.5px;width:100%;border-radius:14px}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--muted)}
.icon-btn[aria-pressed="true"]{color:var(--lock);background:var(--lock-soft)}
.icon-btn.heart[aria-pressed="true"]{color:var(--heart);background:transparent}
:is(.btn,.icon-btn,.chip,.day,.tab,.slot-main,.rcard-main,.prow,.ghead-main,.seg button):focus-visible,
:is(input,textarea,select):focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;position:relative;padding:0}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.day.today::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}

.slots{display:flex;flex-direction:column;gap:10px}
.slot{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 4px 8px 12px;box-shadow:var(--shadow)}
.slot.locked{border-color:var(--lock)}
.slot.off{background:transparent;box-shadow:none;border-style:dashed;color:var(--muted);padding-block:12px}
.slot .dow{font:700 11.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slot.is-today .dow{color:var(--accent)}
.slot-main{background:none;border:0;padding:6px 0;text-align:left;min-width:0;display:block;width:100%}
.name{font:700 17px/1.2 var(--font-display);overflow-wrap:anywhere}
.name.empty{color:var(--muted);font-weight:600}
.name.rolling{color:var(--muted)}
.slot-actions{display:flex}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.pc-chicken{background:var(--c-chicken-bg);color:var(--c-chicken-fg)}
.pc-beef{background:var(--c-beef-bg);color:var(--c-beef-fg)}
.pc-pork{background:var(--c-pork-bg);color:var(--c-pork-fg)}
.pc-seafood{background:var(--c-seafood-bg);color:var(--c-seafood-fg)}
.pc-veg{background:var(--c-veg-bg);color:var(--c-veg-fg)}
.pc-other{background:var(--c-other-bg);color:var(--c-other-fg)}
.mixrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.rules{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.rules summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:14px;min-height:48px}
.rules summary::-webkit-details-marker{display:none}
.sum-t{font:700 16px var(--font-display)}
.rules summary .muted{font-size:13px;text-align:right}
.rules[open]>summary{border-bottom:1px solid var(--line)}
.rules>:not(summary){margin:14px}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rrow label{font-weight:500}
.rrow select{width:auto;min-width:110px}
.rcheck{display:flex;align-items:center;gap:12px;min-height:34px}
.rcheck input{width:22px;height:22px;accent-color:var(--accent);flex:none}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--sunk);border-radius:14px}
.seg button{min-height:42px;border:0;border-radius:10px;background:transparent;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.field{display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=search],input[type=number],textarea,select{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px}
textarea{min-height:150px;resize:vertical;line-height:1.5}
textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.more{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.more summary{cursor:pointer;padding:14px;font-weight:600;min-height:48px}
.more>:not(summary){margin:0 14px 14px;display:flex;flex-direction:column;gap:6px}
.step-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.step-box h2{font-size:17px}

.rlist{display:flex;flex-direction:column;gap:10px}
.rcard{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 4px 8px 14px;box-shadow:var(--shadow)}
.rcard-main{background:none;border:0;padding:6px 0;text-align:left;min-width:0}
.empty-card{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted)}

.aisle{display:flex;flex-direction:column}
.aisle h3{font:700 12.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 0 4px}
.item{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--line);cursor:pointer}
.item input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.item .txt{min-width:0;flex:1}
.item .main{font-weight:500}
.item .qty{font-weight:700;font-variant-numeric:tabular-nums}
.item .why{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.done .main{text-decoration:line-through;color:var(--muted)}
.item.done .qty{color:var(--muted)}

.backdrop{position:fixed;inset:0;background:rgba(8,16,11,.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:620px;margin:0 auto;max-height:92vh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;background:var(--bg);padding:6px 0 2px;margin-right:-8px}
.grab{position:absolute;left:50%;top:8px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
.sheet-body{display:flex;flex-direction:column;gap:16px}
.sheet-title{font:800 26px/1.08 var(--font-display)}
.titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stepper button{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;border-radius:12px}
.stepper span{min-width:70px;text-align:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.ings,.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.ings li{padding:9px 0;border-bottom:1px solid var(--line)}
.ings .q{font-weight:700;font-variant-numeric:tabular-nums}
.steps{counter-reset:s;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
.steps li::before{content:counter(s);font:700 15px var(--font-display);color:var(--accent);background:var(--accent-soft);width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.sec-title{font:700 17px var(--font-display)}
.nights{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.nights button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;padding:0}

.wheel-wrap{position:relative;width:min(300px,100%);aspect-ratio:1;margin:14px auto 6px}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-10px;width:0;height:0;margin-left:-13px;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.wheel-result{text-align:center;font:700 18px/1.25 var(--font-display);min-height:46px;display:grid;place-items:center;text-wrap:balance}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
@supports (background:color-mix(in srgb,red 50%,blue)){.tabs{background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.tab{background:none;border:0;border-radius:12px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .ic{background:var(--accent-soft);border-radius:999px;padding:3px 14px;box-sizing:content-box;margin:-3px 0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.chev{transition:none}}
.slot .icon-btn{width:40px;height:40px}
.groups{display:flex;flex-direction:column;gap:22px}
.group{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:4px}
.ghead-main{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;text-align:left}
.gname{font:800 20px/1.1 var(--font-display);letter-spacing:-.015em;overflow-wrap:anywhere}
.gcount{flex:none;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:999px;padding:2px 9px}
.chev{display:inline-flex;color:var(--muted);transition:transform .15s}
.chev:not(.open){transform:rotate(-90deg)}
.picklist{display:flex;flex-direction:column;gap:16px}
.pgroup{display:flex;flex-direction:column;gap:8px}
.pg-title{font:700 12.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prow{width:100%;min-height:56px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.pill.tag{background:var(--lock-soft);color:var(--lock)}
.print-only{display:none}
@media print{
  :root:root:root{--bg:#fff;--surface:#fff;--sunk:#fff;--ink:#000;--muted:#444;--line:#bbb;--accent:#000;color-scheme:light}
  html,body{background:#fff!important;color:#000!important}
  body{padding:0;font-size:13pt}
  .top,.tabs,#toast,.screen-only,.hint,.backdrop,.sheet{display:none!important}
  .print-only{display:block}
  .print-only h1{font:800 24pt var(--font-display);margin:0 0 4pt}
  .print-only p{color:#333;font-size:10.5pt;margin:2pt 0}
  .aisles{columns:2;column-gap:28pt}
  .aisle{break-inside:avoid;margin-bottom:10pt}
  .aisle h3{color:#000;border-bottom:1.5pt solid #000;margin-bottom:2pt}
  .item{min-height:0;padding:5pt 0;border-bottom:.5pt solid #bbb}
  .item input{width:12pt;height:12pt}
  .item .why{font-size:9pt;white-space:normal;overflow:visible;text-overflow:clip}
}

.backdrop{opacity:0;transition:opacity .28s ease}
.backdrop.in{opacity:1}
.sheet{transform:translateY(100%);transition:transform .4s cubic-bezier(.22,1,.36,1);will-change:transform}
.sheet.in{transform:translateY(0)}
.sheet:not(.in){transition-duration:.26s;transition-timing-function:cubic-bezier(.4,0,1,1)}
.sheet.drag{transition:none}
.sheet-head{touch-action:none;cursor:grab}
@media (prefers-reduced-motion:reduce){.backdrop,.sheet{transition:none}}
:root{--cv0:#2F6B4F;--cv0f:#EEF7F1;--cv1:#8A3B2E;--cv1f:#FCEFEA;--cv2:#1F4E6B;--cv2f:#E9F3F9;--cv3:#8F5F0E;--cv3f:#FFF4DC;--cv4:#5B3F7A;--cv4f:#F3ECFA;--cv5:#3F4A52;--cv5f:#EEF2F4}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 14px}
.shelf-item{position:relative;min-width:0}
.cover{position:relative;display:block;width:100%;aspect-ratio:3/4;padding:0;border:0;border-radius:6px 14px 14px 6px;overflow:hidden;text-align:left;background:var(--cv0);color:var(--cv0f);box-shadow:0 1px 2px rgba(0,0,0,.18),0 8px 18px rgba(20,35,25,.16),inset 0 0 0 1px rgba(255,255,255,.07)}
.cover.c0{background:var(--cv0);color:var(--cv0f)}
.cover.c1{background:var(--cv1);color:var(--cv1f)}
.cover.c2{background:var(--cv2);color:var(--cv2f)}
.cover.c3{background:var(--cv3);color:var(--cv3f)}
.cover.c4{background:var(--cv4);color:var(--cv4f)}
.cover.c5{background:var(--cv5);color:var(--cv5f)}
.cover::before{content:"";position:absolute;z-index:2;left:0;top:0;bottom:0;width:11px;background:linear-gradient(90deg,rgba(0,0,0,.30),rgba(0,0,0,.06) 65%,rgba(255,255,255,.14));pointer-events:none}
.cover:not(.has-photo)::after{content:"";position:absolute;right:-30px;bottom:-30px;width:116px;height:116px;border-radius:50%;border:10px solid rgba(255,255,255,.13);pointer-events:none}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.cover-text{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:space-between;gap:6px;padding:14px 12px 12px 24px}
.has-photo .cover-text{justify-content:flex-end;color:#fff;background:linear-gradient(to top,rgba(0,0,0,.74),rgba(0,0,0,0) 58%)}
.cover-name{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;font:800 21px/1.04 var(--font-display);letter-spacing:-.02em;overflow-wrap:anywhere}
.cover:not(.has-photo) .cover-text{padding-top:52px}
.has-photo .cover-name{font-size:18px;-webkit-line-clamp:3}
.cover-count{font:600 12px var(--font-body);letter-spacing:.02em;opacity:.85}
.cover.bare .cover-text{display:none}

<script>
// ==CORE-START==
const PROTEINS=['chicken','beef','pork','seafood','veg','other'];
const EFFORTS=['easy','medium','project'];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYS_FULL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const UNIT_ALIASES={cup:'cup',cups:'cup',tbsp:'tbsp',tbsps:'tbsp',tablespoon:'tbsp',tablespoons:'tbsp',tbs:'tbsp',tsp:'tsp',tsps:'tsp',teaspoon:'tsp',teaspoons:'tsp',lb:'lb',lbs:'lb',pound:'lb',pounds:'lb',oz:'oz',ounce:'oz',ounces:'oz',g:'g',gram:'g',grams:'g',kg:'kg',ml:'ml',l:'l',liter:'l',liters:'l',litre:'l',litres:'l',can:'can',cans:'can',clove:'clove',cloves:'clove',jar:'jar',jars:'jar',packet:'packet',packets:'packet',package:'package',packages:'package',pkg:'package',container:'container',containers:'container',bunch:'bunch',bunches:'bunch',head:'head',heads:'head',slice:'slice',slices:'slice',stick:'stick',sticks:'stick',pinch:'pinch',pinches:'pinch',dash:'dash',dashes:'dash',sprig:'sprig',sprigs:'sprig',bag:'bag',bags:'bag'};
const UNIT_PLURAL={cup:'cups',can:'cans',clove:'cloves',jar:'jars',packet:'packets',package:'packages',container:'containers',bunch:'bunches',head:'heads',slice:'slices',stick:'sticks',pinch:'pinches',dash:'dashes',sprig:'sprigs',bag:'bags'};
const UF={'¼':'1/4','½':'1/2','¾':'3/4','⅓':'1/3','⅔':'2/3','⅛':'1/8','⅜':'3/8','⅝':'5/8','⅞':'7/8'};
const STAPLES=new Set(['salt','pepper','black pepper','salt and pepper','kosher salt','sea salt','olive oil','vegetable oil','cooking oil','oil','water','cooking spray']);
const AISLES=['Produce','Meat & seafood','Dairy & eggs','Bakery','Frozen','Pantry','Other'];
const DEFAULT_BOOK='My Recipes';

function toNum(s){
  s=String(s).trim(); let m;
  if((m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1]+ +m[2]/+m[3];
  if((m=s.match(/^(\d+)\/(\d+)$/))) return +m[1]/+m[2];
  const n=parseFloat(s); return isNaN(n)?null:n;
}
function parseIngredient(line){
  let s=String(line||'').replace(/^[\s\-*•·]+/,'').replace(/\s+/g,' ').trim();
  if(!s) return null;
  s=s.replace(/(\d)?\s?([¼½¾⅓⅔⅛⅜⅝⅞])/g,(m,a,f)=>(a?a+' ':(m.charAt(0)===' '?' ':''))+UF[f]);
  const notes=[];
  s=s.replace(/\(([^)]*)\)/g,(m,t)=>{ if(t.trim()) notes.push(t.trim()); return ' '; }).replace(/\s+/g,' ').trim();
  let qty=null, unit='';
  const mq=s.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)(?:\s*(?:-|–|to)\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?))?(?=\s|$|[a-zA-Z])\s*/);
  if(mq){
    const lo=toNum(mq[1]); const hi=mq[2]?toNum(mq[2]):null;
    qty=hi!=null?Math.max(lo,hi):lo;
    s=s.slice(mq[0].length).trim();
  }
  if(qty!=null){
    const mu=s.match(/^([A-Za-z]+)\.?(?:\s+(.*))?$/);
    if(mu){ const u=UNIT_ALIASES[mu[1].toLowerCase()]; if(u){ unit=u; s=(mu[2]||'').trim(); } }
  }
  s=s.replace(/^of\s+/i,'');
  let item=s, note='';
  const ci=s.indexOf(',');
  if(ci>=0){ item=s.slice(0,ci).trim(); note=s.slice(ci+1).trim(); }
  const tt=item.match(/^(.*?)\s*(?:,?\s*to taste)$/i);
  if(tt){ item=tt[1].trim(); notes.push('to taste'); }
  if(note) notes.unshift(note);
  item=item.replace(/\.$/,'').trim();
  if(!item) return null;
  return {qty,unit,item,note:notes.join('; ')};
}
function fmtQty(n){
  if(n==null||!isFinite(n)) return '';
  if(n<=0) return '0';
  let whole=Math.floor(n+1e-9); const frac=n-whole;
  const F={1:'⅛',2:'¼',3:'⅜',4:'½',5:'⅝',6:'¾',7:'⅞'}; let f='';
  if(Math.abs(frac-1/3)<0.04) f='⅓';
  else if(Math.abs(frac-2/3)<0.04) f='⅔';
  else { let k=Math.round(frac*8); if(k===8){ whole++; k=0; } f=k?F[k]:''; }
  if(!whole&&!f) f='⅛';
  return whole?(f?whole+' '+f:String(whole)):f;
}
function unitLabel(u,q){ if(!u) return ''; if(q>1&&UNIT_PLURAL[u]) return UNIT_PLURAL[u]; return u; }
function fmtMin(m){ if(!m) return ''; if(m<60) return m+' min'; const h=Math.floor(m/60), r=m%60; return r?h+' h '+r+' min':h+' h'; }

const DROP_WORDS=new Set(['fresh','freshly','large','medium','small','extra','virgin','big']);
function singular(w){
  if(w.length>3&&w.endsWith('ies')) return w.slice(0,-3)+'y';
  if(w.endsWith('oes')) return w.slice(0,-2);
  if(w.endsWith('ss')||w.endsWith('us')) return w;
  if(w.length>3&&w.endsWith('s')) return w.slice(0,-1);
  return w;
}
function ingKey(item){
  const words=String(item||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^a-z\s'-]/g,' ').split(/\s+/).filter(w=>w&&!DROP_WORDS.has(w));
  if(!words.length) return '';
  words[words.length-1]=singular(words[words.length-1]);
  return words.join(' ');
}
const PANTRY_RE=/\b(?:broth|stock|bouillon|paste|crushed|marinara|sauce|salsa|beans?|rice|pasta|spaghetti|ziti|noodles?|flour|sugar|oil|vinegar|seasoning|spice|powder|paprika|cumin|chili|breadcrumbs?|cornstarch|shells?|salt|black pepper|peppercorns?|pepper flakes?|peanut butter|coconut milk|honey|syrup|oats|mustard|ketchup|mayo|mayonnaise|blend|diced tomato|canned)\b/;
const FROZEN_RE=/\bfrozen\b/;
const MEAT_RE=/\b(?:chicken|beef|pork|sausage|bacon|salmon|shrimp|fish|turkey|steak|roast|ham|fillet|lamb|cod|tilapia|scallop)s?\b/;
const DAIRY_RE=/\b(?:milk|cream|yogurt|cheese|butter|eggs?|parmesan|mozzarella|cheddar|ricotta|feta|cottage)\b/;
const BAKERY_RE=/\b(?:bun|bread|roll|tortilla|bagel|pita|naan|baguette)s?\b/;
const PRODUCE_RE=/\b(?:onion|garlic|ginger|tomato|potato|pepper|carrot|broccoli|asparagus|lemon|lime|lettuce|cilantro|thyme|parsley|basil|rosemary|scallion|celery|mushroom|spinach|kale|cucumber|avocado|apple|slaw|coleslaw|zucchini|cabbage|corn|squash|jalapeno|herb|mint|dill)s?\b/;
function aisleFor(key){
  if(PANTRY_RE.test(key)) return 'Pantry';
  if(FROZEN_RE.test(key)) return 'Frozen';
  if(MEAT_RE.test(key)) return 'Meat & seafood';
  if(DAIRY_RE.test(key)) return 'Dairy & eggs';
  if(BAKERY_RE.test(key)) return 'Bakery';
  if(PRODUCE_RE.test(key)) return 'Produce';
  return 'Other';
}
function unitFamily(u){
  if(u==='tsp'||u==='tbsp'||u==='cup') return 'vol';
  if(u==='oz'||u==='lb') return 'wt';
  if(u==='g'||u==='kg') return 'g';
  if(u==='ml'||u==='l') return 'ml';
  return 'u:'+u;
}
const BASE={tsp:1,tbsp:3,cup:48,oz:1,lb:16,g:1,kg:1000,ml:1,l:1000};
function pickDisplay(fam,base){
  if(fam==='vol') return base>=24?{qty:base/48,unit:'cup'}:base>=3?{qty:base/3,unit:'tbsp'}:{qty:base,unit:'tsp'};
  if(fam==='wt') return base>=16?{qty:base/16,unit:'lb'}:{qty:base,unit:'oz'};
  if(fam==='g') return base>=1000?{qty:base/1000,unit:'kg'}:{qty:base,unit:'g'};
  if(fam==='ml') return base>=1000?{qty:base/1000,unit:'l'}:{qty:base,unit:'ml'};
  return {qty:base,unit:fam.slice(2)};
}
function buildShopping(recipes,slots,opts){
  opts=opts||{};
  const byId=new Map(recipes.map(r=>[r.id,r]));
  const map=new Map();
  for(let i=0;i<slots.length;i++){
    const r=byId.get(slots[i]); if(!r) continue;
    for(const ing of r.ingredients){
      const key=ingKey(ing.item); if(!key) continue;
      if(opts.hideStaples&&STAPLES.has(key)) continue;
      const fam=unitFamily(ing.unit); const id=key+'|'+fam;
      let g=map.get(id);
      if(!g){ g={id,key,name:ing.item,nameQty:ing.qty||0,fam,base:0,hasQty:false,recipes:new Set()}; map.set(id,g); }
      if(ing.qty!=null){ g.base+=ing.qty*(BASE[ing.unit]||1); g.hasQty=true; if(ing.qty>g.nameQty){ g.name=ing.item; g.nameQty=ing.qty; } }
      g.recipes.add(r.title);
    }
  }
  const out=[...map.values()].map(g=>{
    const d=g.hasQty?pickDisplay(g.fam,g.base):null;
    return {id:g.id,name:g.name,qty:d?d.qty:null,unit:d?d.unit:'',aisle:aisleFor(g.key),recipes:[...g.recipes]};
  });
  out.sort((a,b)=>AISLES.indexOf(a.aisle)-AISLES.indexOf(b.aisle)||a.name.localeCompare(b.name));
  return out;
}

function isoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function daysBetween(a,b){ const x=parseISO(a), y=parseISO(b); if(!x||!y) return null; return Math.round((y-x)/86400000); }
function seeded(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr,rng){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function weightedPick(items,wf,rng){
  if(!items.length) return null;
  const ws=items.map(x=>Math.max(0,wf(x))); const total=ws.reduce((a,b)=>a+b,0);
  if(total<=0) return items[Math.floor(rng()*items.length)];
  let t=rng()*total;
  for(let i=0;i<items.length;i++){ t-=ws[i]; if(t<=0) return items[i]; }
  return items[items.length-1];
}
function makeCtx(recipes,rules,today){
  const keys=new Map(recipes.map(r=>[r.id,new Set(r.ingredients.map(i=>ingKey(i.item)).filter(k=>k&&!STAPLES.has(k)))]));
  return {recipes,byId:new Map(recipes.map(r=>[r.id,r])),keys,today,rules:Object.assign({repeatDays:14,maxProtein:2,easyWeeknights:true,overlap:true,vetoes:[]},rules||{})};
}
function eligible(i,slots,ctx,level){
  const R=ctx.rules; const chosen=new Set(slots.filter(Boolean)); const counts={}; let projects=0;
  for(const id of slots){ if(!id) continue; const r=ctx.byId.get(id); if(!r) continue; counts[r.protein]=(counts[r.protein]||0)+1; if(r.effort==='project') projects++; }
  return ctx.recipes.filter(r=>{
    if(chosen.has(r.id)) return false;
    if(R.vetoes.includes(r.protein)) return false;
    if(level<1&&R.repeatDays>0&&r.lastMade){ const d=daysBetween(r.lastMade,ctx.today); if(d!=null&&d<R.repeatDays) return false; }
    if(level<2){
      if(r.protein!=='veg'&&r.protein!=='other'&&(counts[r.protein]||0)>=R.maxProtein) return false;
      if(r.effort==='project'&&((R.easyWeeknights&&i<=3)||projects>=1)) return false;
    }
    return true;
  });
}
function weight(r,i,slots,ctx){
  const R=ctx.rules; let w=1;
  if(r.favorite) w*=2;
  if(!r.lastMade) w*=1.3; else { const d=daysBetween(r.lastMade,ctx.today); if(d!=null) w*=1+Math.min(Math.max(d,0),60)/60; }
  if(R.easyWeeknights&&i<=3) w*=r.effort==='easy'?3:(r.effort==='medium'?1:0.1);
  if(i>=5&&r.effort==='project') w*=1.5;
  for(const j of [i-1,i+1]){
    const id=slots[j]; if(!id) continue; const n=ctx.byId.get(id);
    if(n&&n.protein===r.protein&&r.protein!=='other') w*=0.25;
  }
  if(R.overlap){
    const mine=ctx.keys.get(r.id); const seen=new Set();
    if(mine) for(const id of slots){ if(!id) continue; const k=ctx.keys.get(id); if(!k) continue; for(const key of mine) if(k.has(key)) seen.add(key); }
    w*=1+0.12*Math.min(seen.size,5);
  }
  return w;
}
function planWeek(recipes,plan,rules,rng,today){
  const ctx=makeCtx(recipes,rules,today);
  const slots=new Array(7).fill(null);
  for(let i=0;i<7;i++) if(plan.active[i]&&plan.locked[i]&&plan.slots[i]&&ctx.byId.has(plan.slots[i])) slots[i]=plan.slots[i];
  const todo=shuffle([0,1,2,3,4,5,6].filter(i=>plan.active[i]&&!slots[i]),rng);
  let relaxed=0, empty=0;
  for(const i of todo){
    let pool=[], lvl=0;
    for(;lvl<=2;lvl++){ pool=eligible(i,slots,ctx,lvl); if(pool.length) break; }
    if(!pool.length){ empty++; continue; }
    if(lvl>0) relaxed++;
    slots[i]=weightedPick(pool,r=>weight(r,i,slots,ctx),rng).id;
  }
  return {slots,relaxed,empty};
}
function wheelItems(i,recipes,slots,rules,rng,today,n){
  const ctx=makeCtx(recipes,rules,today); const others=slots.slice(); others[i]=null; const cur=slots[i];
  let pool=[];
  for(let lvl=0;lvl<=2;lvl++){ pool=eligible(i,others,ctx,lvl).filter(r=>r.id!==cur); if(pool.length>=Math.min(n,3)) break; }
  const out=[]; const rest=pool.slice();
  while(out.length<n&&rest.length){ const p=weightedPick(rest,r=>weight(r,i,others,ctx),rng); out.push(p); rest.splice(rest.indexOf(p),1); }
  return out;
}
function pickWinner(items,i,slots,rules,rng,today,recipes){
  const ctx=makeCtx(recipes||items,rules,today); const others=slots.slice(); others[i]=null;
  return weightedPick(items,r=>weight(r,i,others,ctx),rng);
}

function slugify(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'recipe'; }
function uid(title){ return slugify(title)+'-'+Math.random().toString(36).slice(2,6); }
function toInt(v){ const n=parseInt(v,10); return isFinite(n)&&n>0?n:0; }
function linesOf(v){ if(Array.isArray(v)) return v.map(String); return String(v==null?'':v).split(/\r?\n/); }
function cleanStep(s){ return s.replace(/^\s*(?:step\s*)?\d+\s*[.):-]\s*/i,'').replace(/^[\s\-*•·]+/,'').trim(); }
function normalizeRecipe(o){
  if(!o||typeof o!=='object') return {error:'Not a recipe object'};
  const title=String(o.title||o.name||'').trim();
  if(!title) return {error:'Missing title'};
  const pick=(...ks)=>{ for(const k of ks){ if(o[k]!=null&&o[k]!=='') return o[k]; } return undefined; };
  let protein=String(pick('protein')||'other').toLowerCase().trim();
  const PMAP={fish:'seafood',shrimp:'seafood',vegetarian:'veg',vegan:'veg',vegetable:'veg',meat:'other',turkey:'other',lamb:'other'};
  protein=PMAP[protein]||protein; if(!PROTEINS.includes(protein)) protein='other';
  let effort=String(pick('effort','difficulty')||'medium').toLowerCase().trim();
  const EMAP={hard:'project',difficult:'project',complex:'project',simple:'easy',quick:'easy',moderate:'medium'};
  effort=EMAP[effort]||effort; if(!EFFORTS.includes(effort)) effort='medium';
  const tags=Array.isArray(o.tags)?o.tags.map(String):String(o.tags||'').split(',');
  const ingredients=[];
  for(const x of (Array.isArray(o.ingredients)?o.ingredients:linesOf(o.ingredients))){
    if(x&&typeof x==='object'){
      const q=(x.qty===''||x.qty==null)?null:Number(x.qty);
      const unit=String(x.unit||'').toLowerCase().trim(); let item=String(x.item||x.name||'').trim();
      const canon=UNIT_ALIASES[unit]; if(unit&&!canon&&item) item=unit+' '+item;
      if(item) ingredients.push({qty:Number.isFinite(q)?q:null,unit:canon||'',item,note:String(x.note||'').trim()});
    } else {
      const s=String(x==null?'':x).trim(); if(!s||/:\s*$/.test(s)) continue;
      const p=parseIngredient(s); if(p) ingredients.push(p);
    }
  }
  const stepSrc=Array.isArray(o.steps)?o.steps:Array.isArray(o.instructions)?o.instructions:linesOf(o.steps||o.instructions);
  const steps=stepSrc.map(s=>cleanStep(String(s))).filter(Boolean);
  const lm=pick('lastMade','last_made'); const lastMade=(typeof lm==='string'&&/^\d{4}-\d{2}-\d{2}/.test(lm))?lm.slice(0,10):null;
  return {recipe:{id:o.id?String(o.id):uid(title),title,cookbook:String(pick('cookbook','book')||'').trim()||DEFAULT_BOOK,source:String(o.source||'').trim(),servings:toInt(o.servings)||4,prepMin:toInt(pick('prepMin','prep_min','prep')),cookMin:toInt(pick('cookMin','cook_min','cook')),effort,protein,cuisine:String(o.cuisine||'').trim(),tags:tags.map(t=>t.trim()).filter(Boolean),ingredients,steps,favorite:!!(o.favorite||o.fav),lastMade}};
}
function extractJSON(text){
  let t=String(text||'').replace(/[“”]/g,'"').trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/i); if(fence) t=fence[1].trim();
  const a=t.search(/[\[{]/); if(a<0) throw new Error('No JSON found in that text.');
  const close=t[a]==='{'?'}':']'; const b=t.lastIndexOf(close);
  if(b<a) throw new Error('The JSON looks cut off. Copy the whole reply.');
  return JSON.parse(t.slice(a,b+1));
}
function importRecipes(text){
  let data;
  try{ data=extractJSON(text); }catch(e){ return {recipes:[],errors:[(e&&e.message)||'Could not read that as JSON.'],books:{}}; }
  let books={};
  if(data&&!Array.isArray(data)&&Array.isArray(data.recipes)){ books=sanitizeBooks(data.books); data=data.recipes; }
  const list=Array.isArray(data)?data:[data]; const recipes=[], errors=[];
  list.forEach((o,i)=>{ const r=normalizeRecipe(o); if(r.recipe) recipes.push(r.recipe); else errors.push('Recipe '+(i+1)+': '+r.error); });
  return {recipes,errors,books};
}

}

function photoFromFile(f){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(f); const im=new Image();
    im.onload=()=>{
      try{
        const W=450,H=600,R=W/H; const iw=im.naturalWidth, ih=im.naturalHeight;
        let sw=iw, sh=ih, sx=0, sy=0;
        if(iw/ih>R){ sw=ih*R; sx=(iw-sw)/2; } else { sh=iw/R; sy=(ih-sh)/2; }
        const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
        x.fillStyle='#fff'; x.fillRect(0,0,W,H); x.drawImage(im,sx,sy,sw,sh,0,0,W,H);
        resolve(c.toDataURL('image/jpeg',0.8));
      }catch(e){ reject(new Error('Could not process that photo.')); }
      finally{ URL.revokeObjectURL(url); }
    };
    im.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('That file could not be read as a photo.')); };
    im.src=url;
  });
}

let vtBusy=false;
function withTransition(update,el){
  // A new transition while one is running force-finishes the old one, which is the "snappy" glitch.
  // Ignore taps until the current one has settled.
  if(vtBusy) return;
  if(REDUCED||!document.startViewTransition){ update(); return; }
  if(el) el.style.viewTransitionName='book-cover';
  try{
    vtBusy=true;
    const t=document.startViewTransition(update);
    const done=()=>{ vtBusy=false; if(el) el.style.viewTransitionName=''; };
    t.finished.then(done,done);
    setTimeout(()=>{ vtBusy=false; },900);
  }catch(e){ vtBusy=false; update(); }
}
function openBook(name,el){
  withTransition(()=>{ ui.book=name; ui.q=''; ui.fp='all'; ui.ff=false; ui.enter=true; render(); window.scrollTo(0,0); },el);

function bookRows(scope){
  const q=ui.q.trim().toLowerCase();
  return state.recipes.filter(r=>{
    if(scope&&(r.cookbook||DEFAULT_BOOK)!==scope) return false;
    if(ui.fp!=='all'&&r.protein!==ui.fp) return false;
    if(ui.ff&&!r.favorite) return false;
    return !q||(r.title+' '+r.cookbook+' '+r.cuisine+' '+r.protein+' '+r.tags.join(' ')+' '+r.ingredients.map(x=>x.item).join(' ')).toLowerCase().includes(q);
  });
}
function fillBookBody(box,cnt,anim){
  box.classList.toggle('enter',!!anim); if(anim) setTimeout(()=>box.classList.remove('enter'),1200);
  const scope=ui.book;
  const filtering=!!(ui.q.trim()||ui.fp!=='all'||ui.ff);
  if(!scope&&!filtering){ box.replaceChildren(shelfNode(cnt)); return; }
  const rows=bookRows(scope);
  const total=scope?state.recipes.filter(r=>(r.cookbook||DEFAULT_BOOK)===scope).length:state.recipes.length;
  const redo=()=>fillBookBody(box,cnt);
  const card=(r,i)=>{
    const heart=h('button',{class:'icon-btn heart',type:'button','aria-label':'Favorite '+r.title,'aria-pressed':String(!!r.favorite),onclick:()=>{ r.favorite=!r.favorite; save(); redo(); }},icon('heart',22,r.favorite));
    return h('div',{class:'rcard',style:'--i:'+Math.min(i||0,10)},
      h('button',{class:'rcard-main',type:'button',onclick:()=>openDetail(r.id)},h('div',{class:'name',text:r.title}),h('div',{class:'meta'},metaLine(r),h('span',{text:madeText(r)}))),heart);
  };
  if(!rows.length){
    cnt.textContent=scope?pl(total,'recipe'):'';
    box.replaceChildren(h('div',{class:'empty-card'},
      h('p',{text:filtering?'No recipes match.':'No recipes in this cookbook yet.'}),
      (scope&&!filtering)?h('button',{class:'btn',type:'button',onclick:()=>addToBook(scope)},icon('plus',18),'Add the first recipe'):null));
    return;
  }
  if(scope){
    cnt.textContent=rows.length===total?pl(total,'recipe'):rows.length+' of '+pl(total,'recipe')+' shown';
    box.replaceChildren(h('div',{class:'rlist'},rows.slice().sort((a,b)=>a.title.localeCompare(b.title)).map(card)));
  } else {
    cnt.textContent=pl(rows.length,'recipe')+' found';
    box.replaceChildren(h('div',{class:'groups'},groupByBook(rows).map(g=>h('div',{class:'pgroup'},h('h3',{class:'pg-title',text:g.name}),h('div',{class:'rlist'},g.items.map(card))))));
  }
}

      (editing||ui.review)?h('button',{class:'btn',type:'button',onclick:cancel},'Cancel'):null,

function addAll(recipes){
  let added=0, updated=0;
  recipes.forEach(r=>{ const k=state.recipes.findIndex(x=>x.id===r.id); if(k>=0){ state.recipes[k]=r; updated++; } else { state.recipes.push(r); added++; } });
  save(); return {added,updated};
}
function aiPanel(){
  const msg=h('p',{class:'note err',hidden:true});
  const ta=h('textarea',{id:'ai-json',class:'mono',placeholder:'Paste the JSON here'});

    const {recipes,errors}=importRecipes(ta.value);
    if(!recipes.length){ msg.hidden=false; msg.textContent=errors[0]||'Nothing to import.'; return; }
    if(recipes.length===1&&!errors.length){ ui.draft=recipeToDraft(recipes[0]); delete ui.draft.id; ui.draft.favorite=false; if(ui.draft.cookbook===DEFAULT_BOOK&&ui.lastBook) ui.draft.cookbook=ui.lastBook; ui.review=true; ui.editId=null; render(); window.scrollTo(0,0); return; }
    const {added,updated}=addAll(recipes);
    toast('Added '+added+(updated?', updated '+updated:'')+(errors.length?' ('+errors.length+' skipped)':'')); ui.book=null;
    go('book');
  };
  return h('div',{class:'view'},
    h('div',{class:'step-box'},h('h2',{text:'1. Get the recipe as JSON'}),
      h('p',{class:'sub',text:'Copy this prompt, paste it into any AI chat, and attach a photo of the recipe or paste its text.'}),

      h('p',{class:'sub',text:'A single recipe opens for a quick check before it is saved. Several at once are added directly.'})));
}

function viewShop(){
  const P=state.plan;
  const sig=JSON.stringify(P.slots); if(state.shop.sig!==sig){ state.shop.sig=sig; state.shop.checked={}; save(); }
  const items=buildShopping(state.recipes,P.slots,{hideStaples:state.shop.hideStaples});
  const dinners=P.slots.filter((id,i)=>P.active[i]&&id&&byId(id)).length;
  if(!dinners) return h('section',{class:'view'},h('h1',{class:'view-title',text:'Shopping'}),
    h('div',{class:'empty-card'},h('p',{text:'Plan some dinners first and the list builds itself.'}),h('button',{class:'btn primary',type:'button',onclick:()=>go('week')},'Go to the week')));
  const sub=h('p',{class:'sub',id:'shop-sub'});
  const upd=()=>{ const left=items.filter(it=>!state.shop.checked[it.id]).length; sub.textContent=left+' of '+items.length+' items left for '+dinners+(dinners>1?' dinners':' dinner'); };
  upd();
  const line=it=>(it.qty!=null?fmtQty(it.qty)+(it.unit?' '+unitLabel(it.unit,it.qty):'')+' ':'')+it.name;
  const copyList=()=>{
    const out=[]; AISLES.forEach(a=>{ const g=items.filter(it=>it.aisle===a&&!state.shop.checked[it.id]); if(g.length){ out.push(a.toUpperCase()); g.forEach(it=>out.push('- '+line(it))); out.push(''); } });
    copyText(out.join('\n').trim(),'Shopping list');
  };
  const groups=AISLES.map(a=>{
    const g=items.filter(it=>it.aisle===a); if(!g.length) return null;
    return h('div',{class:'aisle'},h('h3',{text:a}),g.map(it=>{
      const row=h('label',{class:'item'+(state.shop.checked[it.id]?' done':'')},
        h('input',{type:'checkbox',checked:!!state.shop.checked[it.id],onchange:e=>{ if(e.target.checked) state.shop.checked[it.id]=true; else delete state.shop.checked[it.id]; row.classList.toggle('done',e.target.checked); save(); upd(); }}),
        h('div',{class:'txt'},
          h('div',{class:'main'},it.qty!=null?h('span',{class:'qty',text:fmtQty(it.qty)+(it.unit?' '+unitLabel(it.unit,it.qty):'')+' '}):null,it.name),
          h('div',{class:'why',text:it.recipes.join(' · ')})));
      return row;
    }));
  });

    h('div',{class:'print-only'},h('h1',{text:'Shopping list'}),h('p',{text:dinnerList}),h('p',{text:'Printed '+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})})),
    h('div',{class:'field screen-only'},h('h1',{class:'view-title',text:'Shopping'}),sub),
    h('div',{class:'btn-row screen-only'},
      h('button',{class:'btn',type:'button',onclick:copyList},icon('copy',20),'Copy list'),
      h('button',{class:'btn',type:'button',onclick:printList},icon('print',20),'Print list')),
    h('div',{class:'chips screen-only'},
      h('button',{type:'button',class:'chip','aria-pressed':String(state.shop.hideStaples),text:'Hide salt, pepper, oil, water',onclick:()=>{ state.shop.hideStaples=!state.shop.hideStaples; save(); render(); }}),
      h('button',{type:'button',class:'chip',text:'Uncheck all',onclick:()=>{ state.shop.checked={}; save(); render(); }})),
    h('div',{class:'aisles'},groups));
}
function viewBackup(){
  const exp=ui.exportText?h('textarea',{class:'mono',readOnly:true,value:ui.exportText,'aria-label':'Exported recipes'}):null;
  const imp=h('textarea',{id:'imp',class:'mono',placeholder:'Paste exported recipes here'});

  const reset=h('button',{class:'btn danger',type:'button',text:ui.confirmReset?'Tap again to erase everything':'Reset to sample recipes',onclick:()=>{

  }});
  return h('section',{class:'view'},
    h('div',{class:'field'},h('h1',{class:'view-title',text:'Settings'}),h('h2',{class:'sec-title',text:'Backup and sharing'}),h('p',{class:'sub',text:'Recipes live on this device. To share your cookbook with someone else, export it, send them the text, and have them paste it under Import. Cover photos come along, so the text can be long.'})),
    h('div',{class:'step-box'},h('h2',{text:'Export'}),
      h('p',{class:'sub',text:state.recipes.length+' recipes ready to export.'}),

      exp,
      exp?h('button',{class:'btn primary',type:'button',onclick:()=>copyText(ui.exportText,'Exported recipes')},icon('copy',20),'Copy export'):null),

      h('button',{class:'btn primary',type:'button',onclick:()=>{

function renderTabs(){
  const T=[['week','Week','week'],['book','Cookbooks','book'],['shop','Shopping','cart'],['settings','Settings','sliders']];
  const here=ui.tab==='add'?'book':ui.tab;
  document.getElementById('tabs').replaceChildren(...T.map(([id,label,ic])=>h('button',{class:'tab',type:'button','aria-current':here===id?'page':null,onclick:()=>{ if(id==='book'){ ui.book=null; ui.enter=true; } go(id); }},icon(ic,22),h('span',{text:label}))));
}
function render(){
  const views={week:viewWeek,book:viewBook,add:viewAdd,shop:viewShop,settings:viewBackup};
  document.getElementById('view').replaceChildren(views[ui.tab]());
  renderTabs();
}
function go(t){
  ui.tab=t;
  try{ if(location.hash!=='#'+TABHASH[t]) location.hash=TABHASH[t]; }catch(e){}
  render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{ const t=tabFromHash(); if(t&&t!==ui.tab){ ui.tab=t; render(); } });

document.getElementById('today-label').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});

render();
